<text x="44" y="76" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="2">CARD</text>
<text x="556" y="76" text-anchor="end" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="20" fill="#FFFFFF">principle</text>
<text x="44" y="215" font-family="'Space Grotesk','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600" font-size="48" fill="#14161A">Diverge, then</text>
